<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<title>やさしいナンプレ</title>
<style>
  body { font-family: sans-serif; text-align: center; background:#fafafa; }
  h1 { margin: 10px; }.controls { margin: 10px; } select, button { padding:10px 14px; margin:5px; font-size:16px; }

.page { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; }

.grid { display: grid; grid-template-columns: repeat(9, 1fr); width: 360px; height: 360px; border:3px solid black; }

.cell { box-sizing: border-box; border:1px solid #444; display:flex; align-items:center; justify-content:center; font-size:20px; }

.cell input { width:100%; height:100%; text-align:center; font-size:20px; border:none; outline:none; background:transparent; }

.fixed { background:#eaeaea; font-weight:bold; }

/* 縦太線 */ .cell:nth-child(3n+1), .cell:nth-child(3n+2), .cell:nth-child(3n+3) {}

.cell:nth-child(3n) { border-right:3px solid black; }

/* 横太線 */ .cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom:3px solid black; }

/* 左端も太線補正 */ .cell:nth-child(9n+1) { border-left:3px solid black; }

/* 上端補正 */ .cell:nth-child(-n+9) { border-top:3px solid black; }

@media print { button, select, h1 { display:none; } body { margin:0; }

.page {
  width:210mm;
  height:297mm;
  display:grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap:10mm;
  padding:10mm;
  box-sizing:border-box;
}

.grid {
  width:100%;
  height:auto;
  aspect-ratio:1/1;
}

} </style>

</head>
<body><h1>やさしいナンプレ</h1><div class="controls">
  <select id="difficulty">
    <option value="easy">かんたん</option>
    <option value="medium">ふつう</option>
    <option value="hard">むずかしい</option>
  </select>
  <button onclick="generate()">新しく作る</button>
  <button onclick="window.print()">印刷</button>
</div><div id="page" class="page"></div><script>
function emptyBoard(){return Array.from({length:9},()=>Array(9).fill(0));}

function valid(b,r,c,n){
  for(let i=0;i<9;i++) if(b[r][i]===n||b[i][c]===n) return false;
  let sr=Math.floor(r/3)*3, sc=Math.floor(c/3)*3;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++) if(b[sr+i][sc+j]===n) return false;
  return true;
}

function solve(b){
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      if(b[r][c]===0){
        for(let n=1;n<=9;n++){
          if(valid(b,r,c,n)){
            b[r][c]=n;
            if(solve(b)) return true;
            b[r][c]=0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

function countSolutions(b){
  let count=0;
  function dfs(){
    for(let r=0;r<9;r++){
      for(let c=0;c<9;c++){
        if(b[r][c]===0){
          for(let n=1;n<=9;n++){
            if(valid(b,r,c,n)){
              b[r][c]=n;
              dfs();
              b[r][c]=0;
            }
          }
          return;
        }
      }
    }
    count++;
  }
  dfs();
  return count;
}

function fullBoard(){
  let b=emptyBoard();
  solve(b);
  return b;
}

function dig(board,diff){
  let target={easy:30,medium:45,hard:55}[diff];
  let removed=0;

  while(removed<target){
    let r=Math.floor(Math.random()*9);
    let c=Math.floor(Math.random()*9);
    if(board[r][c]===0) continue;

    let backup=board[r][c];
    board[r][c]=0;

    let copy=board.map(row=>row.slice());
    if(countSolutions(copy)!==1){
      board[r][c]=backup;
    } else {
      removed++;
    }
  }
  return board;
}

function createGrid(b){
  const grid=document.createElement("div");
  grid.className="grid";

  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      let d=document.createElement("div");
      d.className="cell";

      if(b[r][c]!==0){
        d.textContent=b[r][c];
        d.classList.add("fixed");
      } else {
        let inp=document.createElement("input");
        inp.maxLength=1;
        inp.oninput=()=>{inp.value=inp.value.replace(/[^1-9]/g,"");};
        d.appendChild(inp);
      }
      grid.appendChild(d);
    }
  }
  return grid;
}

function generate(){
  const container=document.getElementById("page");
  container.innerHTML="";

  let diff=document.getElementById("difficulty").value;

  for(let i=0;i<4;i++){ // 4問生成（印刷最適）
    let b=fullBoard();
    b=dig(b,diff);
    container.appendChild(createGrid(b));
  }
}

window.onload=generate;
</script></body>
</html>
