<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ナンプレ（数独）</title>
  <style>
    body { font-family: sans-serif; text-align: center; }
    h1 { margin-bottom: 10px; }
    .controls { margin: 10px; }
    select, button { padding: 5px 10px; margin: 5px; }.grid {
  display: grid;
  grid-template-columns: repeat(9, 40px);
  grid-template-rows: repeat(9, 40px);
  gap: 0;
  margin: 20px auto;
  width: fit-content;
}

.cell {
  border: 1px solid #999;
  font-size: 20px;
  text-align: center;
  line-height: 40px;
}

.cell input {
  width: 100%;
  height: 100%;
  text-align: center;
  font-size: 20px;
  border: none;
}

.bold-right { border-right: 3px solid black; }
.bold-bottom { border-bottom: 3px solid black; }

@media print {
  button, select { display: none; }
  body { margin: 0; }
}

  </style>
</head>
<body><h1>ナンプレ</h1><div class="controls">
  <select id="difficulty">
    <option value="easy">かんたん</option>
    <option value="medium">ふつう</option>
    <option value="hard">むずかしい</option>
  </select>
  <button onclick="generate()">生成</button>
  <button onclick="window.print()">印刷</button>
</div><div id="grid" class="grid"></div><script>
function createEmptyBoard() {
  return Array.from({ length: 9 }, () => Array(9).fill(0));
}

function isValid(board, row, col, num) {
  for (let i = 0; i < 9; i++) {
    if (board[row][i] === num || board[i][col] === num) return false;
  }
  const startRow = Math.floor(row / 3) * 3;
  const startCol = Math.floor(col / 3) * 3;
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      if (board[startRow + r][startCol + c] === num) return false;
    }
  }
  return true;
}

function solve(board) {
  for (let row = 0; row < 9; row++) {
    for (let col = 0; col < 9; col++) {
      if (board[row][col] === 0) {
        for (let num = 1; num <= 9; num++) {
          if (isValid(board, row, col, num)) {
            board[row][col] = num;
            if (solve(board)) return true;
            board[row][col] = 0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

function generateFullBoard() {
  let board = createEmptyBoard();
  solve(board);
  return board;
}

function removeNumbers(board, difficulty) {
  let attempts = {
    easy: 30,
    medium: 45,
    hard: 55
  }[difficulty];

  while (attempts > 0) {
    let row = Math.floor(Math.random() * 9);
    let col = Math.floor(Math.random() * 9);
    if (board[row][col] !== 0) {
      board[row][col] = 0;
      attempts--;
    }
  }
  return board;
}

function render(board) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";

      if ((c + 1) % 3 === 0 && c !== 8) cell.classList.add("bold-right");
      if ((r + 1) % 3 === 0 && r !== 8) cell.classList.add("bold-bottom");

      if (board[r][c] !== 0) {
        cell.textContent = board[r][c];
      } else {
        const input = document.createElement("input");
        input.maxLength = 1;
        input.oninput = () => {
          input.value = input.value.replace(/[^1-9]/g, "");
        };
        cell.appendChild(input);
      }

      grid.appendChild(cell);
    }
  }
}

function generate() {
  let difficulty = document.getElementById("difficulty").value;
  let board = generateFullBoard();
  board = removeNumbers(board, difficulty);
  render(board);
}

// 初期表示
window.onload = generate;
</script></body>
</html>
