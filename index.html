<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<title>やさしいナンプレ</title>
<style>
  body { font-family: sans-serif; text-align: center; background:#fafafa; }
  h1 { margin: 10px; }.controls { margin: 10px; } select, button { padding:10px 14px; margin:5px; font-size:16px; }

.grid { display: grid; grid-template-columns: repeat(9, 50px); grid-template-rows: repeat(9, 50px); margin: 20px auto; border:3px solid black; /* 外枠を明示 */ }

.cell { box-sizing: border-box; border: 1px solid #444; font-size: 22px; display:flex; align-items:center; justify-content:center; width:50px; height:50px; }

/* inputが枠を壊さないようにする */ .cell input { width:100%; height:100%; text-align:center; font-size:22px; border:none; outline:none; background:transparent; }

.fixed { background:#eaeaea; font-weight:bold; }

/* 3x3の太線を確実に表示 / .cell:nth-child(3n) { border-right:3px solid black; } .cell:nth-child(9n) { border-right:1px solid #444; } / 最後は通常 */

.cell:nth-child(n+19):nth-child(-n+27), .cell:nth-child(n+46):nth-child(-n+54) { border-bottom:3px solid black; }

@media print { button, select { display:none; } body { margin:0; } } </style>

</head>
<body><h1>やさしいナンプレ</h1><div class="controls">
  <select id="difficulty">
    <option value="easy">かんたん</option>
    <option value="medium">ふつう</option>
    <option value="hard">むずかしい</option>
  </select>
  <button onclick="generate()">新しく作る</button>
  <button onclick="window.print()">印刷</button>
</div><div id="grid" class="grid"></div><script>
function emptyBoard(){return Array.from({length:9},()=>Array(9).fill(0));}

function valid(b,r,c,n){
  for(let i=0;i<9;i++) if(b[r][i]===n||b[i][c]===n) return false;
  let sr=Math.floor(r/3)*3, sc=Math.floor(c/3)*3;
  for(let i=0;i<3;i++)for(let j=0;j<3;j++) if(b[sr+i][sc+j]===n) return false;
  return true;
}

function solve(b){
  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      if(b[r][c]===0){
        for(let n=1;n<=9;n++){
          if(valid(b,r,c,n)){
            b[r][c]=n;
            if(solve(b)) return true;
            b[r][c]=0;
          }
        }
        return false;
      }
    }
  }
  return true;
}

function countSolutions(b){
  let count=0;
  function dfs(){
    for(let r=0;r<9;r++){
      for(let c=0;c<9;c++){
        if(b[r][c]===0){
          for(let n=1;n<=9;n++){
            if(valid(b,r,c,n)){
              b[r][c]=n;
              dfs();
              b[r][c]=0;
            }
          }
          return;
        }
      }
    }
    count++;
  }
  dfs();
  return count;
}

function fullBoard(){
  let b=emptyBoard();
  solve(b);
  return b;
}

function dig(board,diff){
  let target={easy:30,medium:45,hard:55}[diff];
  let removed=0;

  while(removed<target){
    let r=Math.floor(Math.random()*9);
    let c=Math.floor(Math.random()*9);
    if(board[r][c]===0) continue;

    let backup=board[r][c];
    board[r][c]=0;

    let copy=board.map(row=>row.slice());
    if(countSolutions(copy)!==1){
      board[r][c]=backup;
    } else {
      removed++;
    }
  }
  return board;
}

function render(b){
  const g=document.getElementById("grid");
  g.innerHTML="";

  for(let r=0;r<9;r++){
    for(let c=0;c<9;c++){
      let d=document.createElement("div");
      d.className="cell";

      if(b[r][c]!==0){
        d.textContent=b[r][c];
        d.classList.add("fixed");
      } else {
        let inp=document.createElement("input");
        inp.maxLength=1;
        inp.oninput=()=>{inp.value=inp.value.replace(/[^1-9]/g,"");};
        d.appendChild(inp);
      }
      g.appendChild(d);
    }
  }
}

function generate(){
  let diff=document.getElementById("difficulty").value;
  let b=fullBoard();
  b=dig(b,diff);
  render(b);
}

window.onload=generate;
</script></body>
</html>
